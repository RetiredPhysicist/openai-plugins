<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DejaVu Memory Graph</title>
<style>
:root {
  --bg: #fafafa;
  --panel: #ffffff;
  --text: #1c1c1e;
  --muted: #6e6e73;
  --hairline: rgba(0,0,0,.1);
  --accent: #6c5ce7;
  --accent-soft: rgba(108,92,231,.14);
  --node-fact: #3d7ef0;
  --node-event: #e8503a;
  --node-procedure: #2aa6a0;
  --node-preference: #c9a227;
  --node-insight: #8e44ad;
  --node-other: #8e8e93;
  --stale: #a1a1a6;
}
:root[data-theme="dark"] {
  --bg: #1c1c1e;
  --panel: #2c2c2e;
  --text: #f2f2f7;
  --muted: #98989d;
  --hairline: rgba(255,255,255,.12);
  --accent-soft: rgba(108,92,231,.28);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  display: grid;
  grid-template-rows: auto minmax(0,1fr);
  font: 13px/1.45 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
}
header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--hairline);
  background: var(--panel);
}
#search {
  flex: 1;
  max-width: 420px;
  padding: 7px 12px;
  border: 1px solid var(--hairline);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  font: inherit;
  outline: none;
}
#search:focus { border-color: var(--accent); }
#status { color: var(--muted); font-size: 12px; }
#stats { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
main { position: relative; min-height: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas.dragging { cursor: grabbing; }
#inspector {
  position: absolute;
  top: 12px;
  right: 12px;
  width: min(340px, 80%);
  max-height: calc(100% - 24px);
  overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--hairline);
  border-radius: 12px;
  padding: 14px 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,.12);
  display: none;
}
#inspector.open { display: block; }
#inspector h2 { margin: 0 0 4px; font-size: 14px; word-break: break-all; }
#inspector .uri { color: var(--muted); font-size: 11px; word-break: break-all; margin-bottom: 10px; }
#inspector .flags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
#inspector .flag {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: .04em;
  font-weight: 600;
}
#inspector .flag.stale { background: rgba(161,161,166,.18); color: var(--muted); }
#inspector pre {
  margin: 0;
  white-space: pre-wrap;
  word-break: break-word;
  font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
}
#inspector .close {
  position: absolute;
  top: 8px;
  right: 10px;
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 16px;
  cursor: pointer;
  padding: 4px;
}
.hit { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <input id="search" type="search" placeholder="Search memories (hybrid)" aria-label="Search memories">
  <span id="status">Loading…</span>
  <span id="stats"></span>
</header>
<main>
  <canvas id="canvas"></canvas>
  <aside id="inspector">
    <button class="close" id="close" aria-label="Close">✕</button>
    <h2 id="insp-title"></h2>
    <div class="uri" id="insp-uri"></div>
    <div class="flags" id="insp-flags"></div>
    <pre id="insp-body"></pre>
  </aside>
</main>
<script>
"use strict";

/* ── MCP Apps bridge ─────────────────────────────────────────────── */
let nextId = 1;
const pending = new Map();
const HOST = window.parent !== window ? window.parent : null;

function post(message) { if (HOST) HOST.postMessage(message, "*"); }

function request(method, params, timeoutMs = 30000) {
  if (!HOST) return Promise.reject(new Error("host unavailable"));
  return new Promise((resolve, reject) => {
    const id = nextId++;
    const timer = setTimeout(() => { pending.delete(id); reject(new Error(method + " timed out")); }, timeoutMs);
    pending.set(id, { resolve, reject, timer });
    post({ jsonrpc: "2.0", id, method, params });
  });
}

async function toolCall(name, args = {}) {
  const result = await request("tools/call", { name, arguments: args });
  if (result?.isError) throw new Error(result.structuredContent?.error?.message ?? "tool failed");
  return result?.structuredContent ?? {};
}

window.addEventListener("message", (event) => {
  if (event.source !== HOST) return;
  const message = event.data;
  if (!message || message.jsonrpc !== "2.0") return;
  if (typeof message.id === "number" && pending.has(message.id)) {
    const item = pending.get(message.id);
    pending.delete(message.id);
    clearTimeout(item.timer);
    if (message.error) item.reject(new Error(message.error.message ?? "request failed"));
    else item.resolve(message.result);
    return;
  }
  if (message.method === "ui/notifications/host-context-changed") {
    applyTheme(message.params?.theme);
  }
});

async function handshake() {
  if (!HOST) return;
  try {
    const result = await request("ui/initialize", {
      appInfo: { name: "dejavu-graph", version: "0.1.0" },
      appCapabilities: {},
      protocolVersion: "2026-01-26",
    });
    applyTheme(result?.hostContext?.theme);
    post({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} });
  } catch {}
}

function applyTheme(theme) {
  if (theme === "dark" || theme === "light") {
    document.documentElement.dataset.theme = theme;
  }
}

/* ── Graph state ─────────────────────────────────────────────────── */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const statsEl = document.getElementById("stats");
const searchEl = document.getElementById("search");
const inspector = document.getElementById("inspector");
const inspTitle = document.getElementById("insp-title");
const inspUri = document.getElementById("insp-uri");
const inspFlags = document.getElementById("insp-flags");
const inspBody = document.getElementById("insp-body");

let nodes = [];       // { id, label, uri, type, stale, priority, snippet, x, y, vx, vy, fixed }
let edges = [];       // { source, target }
let hitSet = new Set();
let selected = null;
let transform = { x: 0, y: 0, k: 1 };
let dragging = null;  // { node?, lastX, lastY, moved }
let running = false;

const TYPE_COLORS = {
  fact: getCss("--node-fact"),
  event: getCss("--node-event"),
  procedure: getCss("--node-procedure"),
  preference: getCss("--node-preference"),
  insight: getCss("--node-insight"),
};
function getCss(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#8e8e93";
}
function nodeColor(node) {
  if (node.type && TYPE_COLORS[node.type]) return TYPE_COLORS[node.type];
  return getCss("--node-other");
}

function resize() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);

function radiusOf(node) {
  const base = node.priority != null ? Math.max(3, 9 - node.priority) : 6;
  const degree = edges.filter((e) => e.source === node.id || e.target === node.id).length;
  return Math.min(18, base + Math.sqrt(degree) * 2);
}

/* ── Simulation ──────────────────────────────────────────────────── */
function tick() {
  const REPULSE = 2200;
  const SPRING = 0.015;
  const SPRING_LEN = 110;
  const DAMP = 0.85;

  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    a.fx = 0; a.fy = 0;
    for (let j = i + 1; j < nodes.length; j++) {
      const b = nodes[j];
      let dx = a.x - b.x, dy = a.y - b.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
      const f = REPULSE / d2;
      const d = Math.sqrt(d2);
      const fx = (dx / d) * f, fy = (dy / d) * f;
      a.fx += fx; a.fy += fy;
      b.fx -= fx; b.fy -= fy;
    }
  }
  for (const e of edges) {
    const a = nodes.find((n) => n.id === e.source);
    const b = nodes.find((n) => n.id === e.target);
    if (!a || !b) continue;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const f = SPRING * (d - SPRING_LEN);
    const fx = (dx / d) * f, fy = (dy / d) * f;
    a.fx += fx; a.fy += fy;
    b.fx -= fx; b.fy -= fy;
  }
  // Root anchor near center-top.
  const root = nodes[0];
  if (root) {
    root.vx += (canvas.clientWidth / 2 / transform.k - root.x) * 0.02;
    root.vy += (canvas.clientHeight / 3 / transform.k - root.y) * 0.02;
  }
  for (const n of nodes) {
    if (n.fixed) { n.vx = 0; n.vy = 0; continue; }
    n.vx = (n.vx + n.fx) * DAMP;
    n.vy = (n.vy + n.fy) * DAMP;
    n.x += Math.max(-8, Math.min(8, n.vx));
    n.y += Math.max(-8, Math.min(8, n.vy));
  }
}

function draw() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);
  ctx.save();
  ctx.translate(transform.x, transform.y);
  ctx.scale(transform.k, transform.k);

  ctx.strokeStyle = getCss("--hairline");
  ctx.lineWidth = 1 / transform.k;
  for (const e of edges) {
    const a = nodes.find((n) => n.id === e.source);
    const b = nodes.find((n) => n.id === e.target);
    if (!a || !b) continue;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  for (const n of nodes) {
    const r = radiusOf(n);
    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
    ctx.fillStyle = nodeColor(n);
    ctx.globalAlpha = hitSet.size > 0 && !hitSet.has(n.id) ? 0.18 : 1;
    ctx.fill();
    if (n.stale) {
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = getCss("--stale");
      ctx.lineWidth = 2 / transform.k;
      ctx.stroke();
    }
    if (n === selected) {
      ctx.globalAlpha = 1;
      ctx.strokeStyle = getCss("--accent");
      ctx.lineWidth = 3 / transform.k;
      ctx.stroke();
    }
    if (hitSet.has(n.id)) {
      ctx.globalAlpha = 1;
      ctx.strokeStyle = getCss("--accent");
      ctx.lineWidth = 2 / transform.k;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    if (transform.k > 0.45 || n === selected) {
      ctx.fillStyle = getCss("--text");
      ctx.font = `${11 / Math.max(1, Math.min(transform.k, 1.4))}px -apple-system, sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText(n.label.length > 26 ? n.label.slice(0, 25) + "…" : n.label, n.x, n.y + r + 12);
    }
  }
  ctx.restore();
}

function frame() {
  if (running) { tick(); }
  draw();
  requestAnimationFrame(frame);
}

function startSimulation() { running = true; }
function coolDown() {
  // Let the layout settle a bit after each data load.
  setTimeout(() => { running = false; }, 3000);
}

/* ── Interaction ─────────────────────────────────────────────────── */
function toCanvas(event) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (event.clientX - rect.left - transform.x) / transform.k,
    y: (event.clientY - rect.top - transform.y) / transform.k,
  };
}
function nodeAt(pt) {
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    const dx = pt.x - n.x, dy = pt.y - n.y;
    if (dx * dx + dy * dy <= radiusOf(n) ** 2) return n;
  }
  return null;
}

canvas.addEventListener("pointerdown", (event) => {
  canvas.setPointerCapture(event.pointerId);
  const pt = toCanvas(event);
  const node = nodeAt(pt);
  dragging = node ? { node, startX: pt.x, startY: pt.y, moved: false } : { startX: event.clientX, startY: event.clientY, moved: false };
  if (node) { node.fixed = true; startSimulation(); }
  canvas.classList.add("dragging");
});
canvas.addEventListener("pointermove", (event) => {
  const pt = toCanvas(event);
  if (!dragging) return;
  const dx = event.clientX - dragging.startX;
  const dy = event.clientY - dragging.startY;
  if (!dragging.moved && Math.hypot(dx, dy) > 3) dragging.moved = true;
  if (dragging.node) {
    dragging.node.x = pt.x;
    dragging.node.y = pt.y;
  } else if (dragging.moved) {
    transform.x += dx;
    transform.y += dy;
    dragging.startX = event.clientX;
    dragging.startY = event.clientY;
  }
});
canvas.addEventListener("pointerup", (event) => {
  const wasDrag = dragging?.moved;
  const node = dragging?.node;
  if (node) node.fixed = false;
  dragging = null;
  canvas.classList.remove("dragging");
  if (!wasDrag) {
    const pt = toCanvas(event);
    const clicked = nodeAt(pt);
    if (clicked) selectNode(clicked);
    else closeInspector();
  }
});
canvas.addEventListener("wheel", (event) => {
  event.preventDefault();
  const scale = Math.exp(-event.deltaY * 0.0015);
  const rect = canvas.getBoundingClientRect();
  const mx = event.clientX - rect.left, my = event.clientY - rect.top;
  transform.x = mx - (mx - transform.x) * scale;
  transform.y = my - (my - transform.y) * scale;
  transform.k = Math.max(0.15, Math.min(4, transform.k * scale));
}, { passive: false });
canvas.addEventListener("dblclick", (event) => {
  const node = nodeAt(toCanvas(event));
  if (node) expandNode(node);
});

/* ── Data ────────────────────────────────────────────────────────── */
async function loadData(opts = {}) {
  statusEl.textContent = "Loading…";
  try {
    const data = await toolCall("graph_data", { root: opts.root ?? "noc://", depth: opts.depth ?? 2, limit: opts.limit ?? 30 });
    mergeGraph(data, opts.root ?? "noc://");
    statusEl.textContent = "";
    statsEl.textContent = `${nodes.length} nodes · ${edges.length} links`;
  } catch (error) {
    statusEl.textContent = error.message;
  }
  startSimulation();
  coolDown();
}

function mergeGraph(data, rootUri) {
  const rootId = rootUri.replace(/\/+$/, "") || data.root;
  const existing = new Map(nodes.map((n) => [n.id, n]));
  const next = [];
  for (const raw of data.nodes) {
    if (existing.has(raw.id)) { next.push(existing.get(raw.id)); continue; }
    next.push({
      id: raw.id,
      label: raw.label,
      uri: raw.id,
      type: raw.type ?? null,
      stale: false,
      priority: null,
      snippet: "",
      x: Math.random() * canvas.clientWidth,
      y: Math.random() * canvas.clientHeight,
      vx: 0, vy: 0, fixed: false,
    });
  }
  // Drop nodes no longer reachable if this was a fresh root load.
  if (nodes.length === 0 || data.nodes.some((n) => n.id === rootId)) {
    if (nodes.length === 0) nodes = next;
    else {
      const keep = new Set(next.map((n) => n.id));
      nodes = nodes.filter((n) => keep.has(n.id) || true); // additive merge; never drop user context
      for (const n of next) {
        if (!nodes.some((e) => e.id === n.id)) nodes.push(n);
      }
    }
  }
  const ids = new Set(nodes.map((n) => n.id));
  for (const e of data.edges) {
    if (ids.has(e.source) && ids.has(e.target) && !edges.some((x) => x.source === e.source && x.target === e.target)) {
      edges.push(e);
    }
  }
}

async function expandNode(node) {
  statusEl.textContent = `Expanding ${node.label}…`;
  try {
    await loadData({ root: node.uri, depth: 1, limit: 30 });
    statusEl.textContent = "";
  } catch (error) {
    statusEl.textContent = error.message;
  }
}

async function selectNode(node) {
  selected = node;
  inspTitle.textContent = node.label;
  inspUri.textContent = node.uri;
  inspFlags.innerHTML = "";
  inspBody.textContent = "Loading…";
  inspector.classList.add("open");
  try {
    const data = await toolCall("graph_read", { uri: node.uri });
    node.snippet = data.body ?? "";
    node.type = data.type ?? node.type;
    node.stale = Boolean(data.stale);
    node.priority = data.memoryId != null ? node.priority : node.priority;
    inspFlags.innerHTML = [
      node.type ? `<span class="flag">${node.type}</span>` : "",
      node.stale ? `<span class="flag stale">stale</span>` : "",
    ].join("");
    inspBody.textContent = node.snippet || "(empty)";
  } catch (error) {
    inspBody.textContent = error.message;
  }
}

function closeInspector() {
  inspector.classList.remove("open");
  selected = null;
}
document.getElementById("close").addEventListener("click", closeInspector);

/* ── Search ──────────────────────────────────────────────────────── */
let searchTimer = null;
searchEl.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 250);
});
searchEl.addEventListener("keydown", (event) => {
  if (event.key === "Escape") { searchEl.value = ""; hitSet = new Set(); draw(); }
  if (event.key === "Enter") { clearTimeout(searchTimer); runSearch(); }
});

async function runSearch() {
  const query = searchEl.value.trim();
  if (!query) { hitSet = new Set(); draw(); return; }
  statusEl.textContent = "Searching…";
  try {
    const { hits } = await toolCall("graph_search", { query, limit: 12 });
    hitSet = new Set(hits.map((h) => h.uri));
    // Pull hit content into nodes so selection works even for unseen URIs.
    for (const hit of hits) {
      if (!nodes.some((n) => n.id === hit.uri)) {
        const parsed = new URL(hit.uri.replace(/\/$/, ""));
        nodes.push({
          id: hit.uri, label: hit.uri.split("/").pop() || hit.uri, uri: hit.uri,
          type: hit.type, stale: hit.stale, priority: hit.priority, snippet: hit.snippet,
          x: Math.random() * canvas.clientWidth, y: Math.random() * canvas.clientHeight,
          vx: 0, vy: 0, fixed: false,
        });
        edges.push({ source: nodes[0].id, target: hit.uri });
      }
    }
    statusEl.textContent = hits.length ? `${hits.length} hits` : "No hits";
    startSimulation(); coolDown();
  } catch (error) {
    statusEl.textContent = error.message;
  }
}

/* ── Boot ────────────────────────────────────────────────────────── */
handshake().then(() => {
  resize();
  frame();
  loadData();
});
</script>
</body>
</html>
