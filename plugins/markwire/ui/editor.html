<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarkWire</title>
<style>
:root {
  --mw-bg: #ffffff;
  --mw-panel: #f7f7f8;
  --mw-border: #dedfe3;
  --mw-fg: #1a1c20;
  --mw-muted: #74777d;
  --mw-accent: #2563eb;
  --mw-danger: #dc2626;
  --mw-cell: 9px;
  --mw-line: 19px;
  --mw-side: 192px;
  --mw-right: 240px;
}

:root[data-theme="dark"] {
  --mw-bg: #1a1a1a;
  --mw-panel: #212121;
  --mw-border: #35363a;
  --mw-fg: #ececef;
  --mw-muted: #9ca0a8;
  --mw-accent: #60a5fa;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--mw-bg);
  color: var(--mw-fg);
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }

.mw-app {
  display: grid;
  grid-template-columns: var(--mw-side) minmax(0, 1fr) var(--mw-right);
  height: 100%;
  min-height: 0;
}

.mw-side,
.mw-inspector {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--mw-panel);
}
.mw-side { border-right: 1px solid var(--mw-border); overflow-y: auto; }
.mw-inspector { border-left: 1px solid var(--mw-border); overflow-y: auto; }

.mw-group { padding: 0 8px 12px; }
.mw-group > h2 {
  margin: 8px 4px 6px;
  color: var(--mw-muted);
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0;
  text-transform: uppercase;
}
.mw-tool {
  display: flex;
  width: 100%;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--mw-fg);
  cursor: pointer;
  text-align: left;
}
.mw-tool:hover { background: color-mix(in srgb, var(--mw-fg) 7%, transparent); }
.mw-tool[aria-pressed="true"] { background: var(--mw-accent); color: #fff; }
.mw-tool code {
  width: 18px;
  color: inherit;
  font: 13px/1 ui-monospace, monospace;
  text-align: center;
}

.mw-icon {
  display: inline-flex;
  flex: 0 0 auto;
  width: 18px;
  height: 18px;
  align-items: center;
  justify-content: center;
  color: inherit;
}
.mw-icon svg { width: 100%; height: 100%; display: block; }
.mw-tool .mw-icon { width: 16px; height: 16px; }
.mw-mobile-tools .mw-icon { width: 18px; height: 18px; }
.mw-more {
  padding: 4px 8px 2px;
  border: 0;
  background: none;
  color: var(--mw-muted);
  cursor: pointer;
  font-size: 10px;
}
.mw-secondary { display: none; }
.mw-secondary.is-open { display: block; }

.mw-center {
  display: flex;
  min-width: 0;
  min-height: 0;
  flex-direction: column;
}

.mw-toolbar {
  display: flex;
  min-height: 38px;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  border-bottom: 1px solid var(--mw-border);
  background: var(--mw-bg);
}
.mw-toolbar button {
  display: inline-flex;
  min-width: 28px;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 5px 7px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--mw-muted);
  cursor: pointer;
}
.mw-toolbar button > svg { width: 16px; height: 16px; display: block; }
.mw-toolbar button:hover { background: color-mix(in srgb, var(--mw-fg) 7%, transparent); color: var(--mw-fg); }
.mw-toolbar button[aria-pressed="true"] { background: color-mix(in srgb, var(--mw-accent) 14%, transparent); color: var(--mw-accent); }
.mw-toolbar button:disabled { opacity: .25; cursor: default; }
.mw-toolbar .mw-primary {
  margin-left: auto;
  background: var(--mw-accent);
  color: #fff;
  font-weight: 600;
}
.mw-toolbar .mw-primary:hover { background: color-mix(in srgb, var(--mw-accent) 88%, #000); color: #fff; }
.mw-text-input {
  position: fixed;
  left: 50%;
  bottom: 18px;
  z-index: 40;
  width: min(320px, 70vw);
  padding: 8px 10px;
  transform: translateX(-50%);
  border: 1px solid var(--mw-accent);
  border-radius: 8px;
  background: var(--mw-bg);
  color: var(--mw-fg);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
}
.mw-text-input[hidden] { display: none; }
.mw-output {
  position: fixed;
  left: 50%;
  bottom: 18px;
  z-index: 41;
  width: min(560px, 86vw);
  height: 132px;
  transform: translateX(-50%);
  padding: 8px 10px;
  border: 1px solid var(--mw-border);
  border-radius: 8px;
  background: var(--mw-bg);
  color: var(--mw-fg);
  font: 12px/1.45 ui-monospace, monospace;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
}
.mw-output[hidden] { display: none; }

.mw-canvas {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: auto;
  background: var(--mw-bg);
}
.mw-grid-wrap { position: relative; padding: 16px; }

.mw-eraser-preview {
  position: absolute;
  z-index: 3;
  pointer-events: none;
  border: 1px solid var(--mw-accent);
  background: color-mix(in srgb, var(--mw-accent) 14%, transparent);
  border-radius: 2px;
}
.mw-eraser-preview[hidden] { display: none; }

.mw-eraser-size {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 6px;
  color: var(--mw-muted);
  font-size: 11px;
}
.mw-eraser-size[hidden] { display: none; }
.mw-eraser-size input { width: 72px; accent-color: var(--mw-accent); }
.mw-eraser-size output { min-width: 12px; text-align: center; }
.mw-grid {
  display: inline-grid;
  width: max-content;
  border: 1px solid var(--mw-border);
  background:
    repeating-linear-gradient(to right, color-mix(in srgb, var(--mw-border) 55%, transparent) 0 1px, transparent 1px var(--mw-cell)),
    repeating-linear-gradient(to bottom, color-mix(in srgb, var(--mw-border) 55%, transparent) 0 1px, transparent 1px var(--mw-line));
  font: 13px/var(--mw-line) ui-monospace, SFMono-Regular, Menlo, monospace;
  touch-action: none;
  user-select: none;
}
.mw-grid.is-gridless { background: none; }
.mw-cell {
  width: var(--mw-cell);
  height: var(--mw-line);
  overflow: hidden;
  text-align: center;
  white-space: pre;
}
.mw-cell.is-selected { background: color-mix(in srgb, var(--mw-accent) 18%, transparent); }

.mw-statusbar {
  display: flex;
  min-height: 30px;
  align-items: center;
  gap: 12px;
  padding: 4px 10px;
  border-top: 1px solid var(--mw-border);
  color: var(--mw-muted);
  font-size: 11px;
}
.mw-statusbar .mw-grow { flex: 1; }
.mw-size-select {
  border: 0;
  background: transparent;
  color: var(--mw-muted);
  cursor: pointer;
}

.mw-section {
  padding: 10px 12px;
  border-bottom: 1px solid var(--mw-border);
}
.mw-section h3 {
  margin: 0 0 8px;
  color: var(--mw-muted);
  font-size: 10px;
  font-weight: 650;
  text-transform: uppercase;
}
.mw-layer,
.mw-empty {
  padding: 6px 7px;
  border-radius: 6px;
  color: var(--mw-muted);
  font-size: 12px;
}
.mw-layer { cursor: pointer; }
.mw-layer:hover { background: color-mix(in srgb, var(--mw-fg) 7%, transparent); }
.mw-layer[aria-selected="true"] { background: color-mix(in srgb, var(--mw-accent) 14%, transparent); color: var(--mw-fg); }
.mw-field { display: grid; grid-template-columns: 1fr 76px; align-items: center; gap: 6px; margin: 6px 0; }
.mw-field label { color: var(--mw-muted); font-size: 11px; }
.mw-field input, .mw-field select {
  width: 100%;
  padding: 4px 6px;
  border: 1px solid var(--mw-border);
  border-radius: 6px;
  background: var(--mw-bg);
}

.mw-mobile-tools { display: none; }

@media (max-width: 980px) {
  :root { --mw-side: 168px; --mw-right: 210px; }
}

@media (max-width: 760px) {
  :root { --mw-cell: 10px; --mw-line: 20px; }
  html, body { height: 100%; overflow: hidden; }
  .mw-app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) auto;
    height: 100dvh;
    overflow: hidden;
  }
  .mw-side, .mw-inspector { display: none; }
  .mw-center { grid-row: 1; min-height: 0; }
  .mw-canvas { min-height: 0; }
  .mw-mobile-tools {
    display: grid;
    grid-row: 2;
    grid-auto-flow: column;
    grid-template-rows: repeat(4, auto);
    grid-auto-columns: 52px;
    gap: 2px;
    padding: 4px;
    border-top: 1px solid var(--mw-border);
    background: var(--mw-panel);
    overflow-x: auto;
  }
  .mw-mobile-tools button {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 4px 2px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--mw-muted);
    cursor: pointer;
    font-size: 9px;
  }
  .mw-mobile-tools button span:last-child {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .mw-mobile-tools button[aria-pressed="true"] { background: var(--mw-accent); color: #fff; }
  .mw-toolbar {
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .mw-toolbar::-webkit-scrollbar { display: none; }
  .mw-toolbar button { flex: 0 0 auto; }
  .mw-toolbar .mw-primary { margin-left: 0; }
  .mw-text-input { bottom: calc(154px + env(safe-area-inset-bottom, 0px)); }
}

</style>
</head>
<body>
<div id="markwire-root"></div>
<script type="module">
/**
 * MarkWire board engine.
 *
 * One implementation shared by the editor UI and the server: the UI inlines this
 * file, and the server imports it. Keeping a single copy is what lets the editor
 * and the server agree on exactly how a shape becomes characters.
 *
 * The board stores geometry (boxes, strokes, labels) and derives the character
 * grid on demand. Storing geometry rather than merged glyphs keeps the output
 * independent of drawing order, so a divider drawn before or after the box edge
 * it meets produces the same picture.
 */

const GLYPH = {
  horizontal: "─",
  vertical: "│",
  topLeft: "┌",
  topRight: "┐",
  bottomLeft: "└",
  bottomRight: "┘",
  teeDown: "┬",
  teeUp: "┴",
  teeRight: "├",
  teeLeft: "┤",
  cross: "┼",
};

/** Renders an arm set. A cell with no arms falls back to a stroke on its own axis. */
function glyphFor(arms, fallbackAxis) {
  const { up, down, left, right } = arms;
  if (up && down && left && right) return GLYPH.cross;
  if (up && down && right) return GLYPH.teeRight;
  if (up && down && left) return GLYPH.teeLeft;
  if (left && right && down) return GLYPH.teeDown;
  if (left && right && up) return GLYPH.teeUp;
  if (down && right) return GLYPH.topLeft;
  if (down && left) return GLYPH.topRight;
  if (up && right) return GLYPH.bottomLeft;
  if (up && left) return GLYPH.bottomRight;
  if (left && right) return GLYPH.horizontal;
  if (up && down) return GLYPH.vertical;
  if (fallbackAxis === "v") return GLYPH.vertical;
  if (fallbackAxis === "h") return GLYPH.horizontal;
  return " ";
}

class Board {
  constructor(rows, cols) {
    this.rows = Math.max(1, Math.floor(rows));
    this.cols = Math.max(1, Math.floor(cols));
    this.shapes = [];
  }

  inBounds(row, col) {
    return row >= 0 && row < this.rows && col >= 0 && col < this.cols;
  }

  clone() {
    return Board.fromShapes(this.rows, this.cols, this.shapes);
  }

  static createShapeId() {
    Board.nextId = (Board.nextId ?? 0) + 1;
    return `shape-${Board.nextId}`;
  }

  /** Adds a shape and assigns the identity used by selection and layers. */
  add(shape) {
    const next = { id: shape.id ?? Board.createShapeId(), ...shape };
    this.shapes.push(next);
    return next;
  }

  /** Applies a human-readable role to every shape created by one component gesture. */
  labelSince(index, role) {
    for (const shape of this.shapes.slice(index)) shape.role = role;
  }

  select(id) {
    return this.shapes.find((shape) => shape.id === id);
  }

  remove(id) {
    const before = this.shapes.length;
    this.shapes = this.shapes.filter((shape) => shape.id !== id);
    return this.shapes.length !== before;
  }

  /** Moves a shape by row and column deltas. */
  move(id, dRow, dCol) {
    const shape = this.select(id);
    if (!shape) return false;
    if (shape.kind === "cells") {
      const rows = shape.cells.map((cell) => cell.row);
      const cols = shape.cells.map((cell) => cell.col);
      const minRow = Math.min(...rows);
      const maxRow = Math.max(...rows);
      const minCol = Math.min(...cols);
      const maxCol = Math.max(...cols);
      const rowDelta = Math.max(-minRow, Math.min(this.rows - 1 - maxRow, dRow));
      const colDelta = Math.max(-minCol, Math.min(this.cols - 1 - maxCol, dCol));
      shape.cells = shape.cells.map((cell) => ({
        ...cell,
        row: cell.row + rowDelta,
        col: cell.col + colDelta,
      }));
      return true;
    }
    shape.row = Math.max(0, Math.min(this.rows - 1, shape.row + dRow));
    shape.col = Math.max(0, Math.min(this.cols - 1, shape.col + dCol));
    return true;
  }

  /** Resizes a box-like shape by changing its width and height. */
  resize(id, width, height) {
    const shape = this.select(id);
    if (!shape) return false;
    if (shape.kind === "box") {
      shape.width = Math.max(2, Math.min(this.cols - shape.col, width));
      shape.height = Math.max(2, Math.min(this.rows - shape.row, height));
      return true;
    }
    if (shape.kind === "h") {
      shape.length = Math.max(1, Math.min(this.cols - shape.col, width));
      return true;
    }
    if (shape.kind === "v") {
      shape.length = Math.max(1, Math.min(this.rows - shape.row, height));
      return true;
    }
    return false;
  }

  /** Applies a steady drag gesture to one shape. */
  moveByGesture(id, dRow, dCol) {
    return this.move(id, dRow, dCol);
  }

  /** Resizes by the distance between opposite corners of a drag. */
  resizeByGesture(id, dRow, dCol) {
    const shape = this.select(id);
    if (!shape) return false;
    if (shape.kind === "box") {
      return this.resize(id, dCol, dRow);
    }
    if (shape.kind === "h") {
      return this.resize(id, dCol, shape.length);
    }
    if (shape.kind === "v") {
      return this.resize(id, shape.length, dRow);
    }
    return false;
  }

  /** Moves one shape to the end of the paint order. */
  bringToFront(id) {
    const index = this.shapes.findIndex((shape) => shape.id === id);
    if (index < 0 || index === this.shapes.length - 1) return false;
    const [shape] = this.shapes.splice(index, 1);
    this.shapes.push(shape);
    return true;
  }

  /** Moves one shape to the start of the paint order. */
  sendToBack(id) {
    const index = this.shapes.findIndex((shape) => shape.id === id);
    if (index <= 0) return false;
    const [shape] = this.shapes.splice(index, 1);
    this.shapes.unshift(shape);
    return true;
  }

  /** Reorders by one position in the paint order. */
  reorder(id, delta) {
    const index = this.shapes.findIndex((shape) => shape.id === id);
    if (index < 0) return false;
    const target = Math.max(0, Math.min(this.shapes.length - 1, index + delta));
    if (target === index) return false;
    const [shape] = this.shapes.splice(index, 1);
    this.shapes.splice(target, 0, shape);
    return true;
  }

  /** Rectangle outline. */
  box(row, col, height, width) {
    if (height < 2 || width < 2) return;
    const bottom = row + height - 1;
    const right = col + width - 1;
    this.add({ kind: "box", row, col, height, width });
  }

  hline(row, col, length) {
    if (length < 1) return;
    this.add({ kind: "h", row, col, length });
  }

  vline(row, col, length) {
    if (length < 1) return;
    this.add({ kind: "v", row, col, length });
  }

  /** Multi-line label. Labels paint over strokes. */
  text(row, col, text) {
    this.add({ kind: "text", row, col, text });
  }

  /** Adds a single character stroke, preserving painted order. */
  stroke(row, col, char) {
    if (!this.inBounds(row, col) || char === " ") return;
    this.add({ kind: "stroke", row, col, char });
  }

  /**
   * Imports a plain-text region as a single stroke shape.
   *
   * Pasting is the inverse of export: every non-space character becomes a
   * painted cell, so pasted artwork keeps its exact column alignment.
   */
  pasteText(text, row = 0, col = 0) {
    const lines = text.replace(/\t/g, "    ").replace(/\r/g, "").split("\n");
    const cells = [];
    for (let lineIndex = 0; lineIndex < lines.length; lineIndex++) {
      for (let charIndex = 0; charIndex < lines[lineIndex].length; charIndex++) {
        const char = lines[lineIndex][charIndex];
        if (char === " ") continue;
        const targetRow = row + lineIndex;
        const targetCol = col + charIndex;
        if (!this.inBounds(targetRow, targetCol)) continue;
        cells.push({ row: targetRow, col: targetCol, char });
      }
    }
    if (cells.length === 0) return null;
    return this.add({ kind: "cells", cells });
  }

  /** Converts a rectangle tool into a dashed or plain horizontal run. */
  line(row, col, length) {
    this.hline(row, col, length);
  }

  /** Draws an arrow along the major axis. */
  arrow(row, col, dRow, dCol) {
    const vertical = Math.abs(dRow) >= Math.abs(dCol);
    if (vertical) {
      const start = Math.min(row, row + dRow);
      const length = Math.abs(dRow) + 1;
      this.vline(start, col, length);
      const tip = dRow >= 0 ? row + dRow : row;
      const prev = dRow >= 0 ? tip - 1 : tip + 1;
      if (this.inBounds(prev, col)) {
        const axis = dRow >= 0 ? "↓" : "↑";
        this.add({ kind: "stroke", row: tip, col, char: axis });
      }
      return;
    }
    const start = Math.min(col, col + dCol);
    const length = Math.abs(dCol) + 1;
    this.hline(row, start, length);
    const tip = dCol >= 0 ? col + dCol : col;
    if (this.inBounds(row, tip)) {
      this.add({ kind: "stroke", row, col: tip, char: dCol >= 0 ? "→" : "←" });
    }
  }

  /**
   * Removes strokes inside a rectangle.
   *
   * Shapes are axis-aligned runs, so erasing trims or splits each run that
   * overlaps the region instead of tracking pixels. Labels are dropped whole when
   * their first cell falls inside the region.
   */
  erase(row, col, height, width) {
    const top = row;
    const bottom = row + height - 1;
    const left = col;
    const right = col + width - 1;
    const kept = [];

    for (const shape of this.shapes) {
      if (shape.kind === "cells") {
        const cells = shape.cells.filter((cell) => !(
          cell.row >= top && cell.row <= bottom && cell.col >= left && cell.col <= right
        ));
        if (cells.length > 0) kept.push({ ...shape, cells });
        continue;
      }

      if (shape.kind === "text" || shape.kind === "stroke") {
        if (shape.row >= top && shape.row <= bottom && shape.col >= left && shape.col <= right) continue;
        kept.push(shape);
        continue;
      }

      if (shape.kind === "box") {
        const shapeBottom = shape.row + shape.height - 1;
        const shapeRight = shape.col + shape.width - 1;
        if (
          shape.row < top ||
          shape.col < left ||
          shapeBottom > bottom ||
          shapeRight > right
        ) {
          kept.push(shape);
          continue;
        }
        continue;
      }

      if (shape.kind === "h") {
        if (shape.row < top || shape.row > bottom) {
          kept.push(shape);
          continue;
        }
        const start = shape.col;
        const end = shape.col + shape.length - 1;
        if (end < left || start > right) {
          kept.push(shape);
          continue;
        }
        if (start < left) kept.push({ ...shape, length: left - start });
        if (end > right) {
          kept.push({ ...shape, col: right + 1, length: end - right });
        }
        continue;
      }

      if (shape.kind === "v") {
        if (shape.col < left || shape.col > right) {
          kept.push(shape);
          continue;
        }
        const start = shape.row;
        const end = shape.row + shape.length - 1;
        if (end < top || start > bottom) {
          kept.push(shape);
          continue;
        }
        if (start < top) kept.push({ ...shape, length: top - start });
        if (end > bottom) {
          kept.push({ ...shape, row: bottom + 1, length: end - bottom });
        }
      }
    }

    this.shapes = kept;
  }

  clear() {
    this.shapes = [];
  }

  undo() {
    return this.shapes.pop() !== undefined;
  }

  /** Strokes covering this cell, with the arms each run reaches within its own cells. */
  cellAt(row, col) {
    const cell = { up: false, down: false, left: false, right: false, hasH: false, hasV: false };
    for (const shape of this.shapes) {
      if (shape.kind === "box") {
        const bottom = shape.row + shape.height - 1;
        const right = shape.col + shape.width - 1;
        if (row === shape.row || row === bottom) {
          if (col >= shape.col && col <= right) {
            cell.hasH = true;
            if (col > shape.col) cell.left = true;
            if (col < right) cell.right = true;
          }
        }
        if (col === shape.col || col === right) {
          if (row >= shape.row && row <= bottom) {
            cell.hasV = true;
            if (row > shape.row) cell.up = true;
            if (row < bottom) cell.down = true;
          }
        }
      } else if (shape.kind === "h" && shape.row === row) {
        if (col >= shape.col && col < shape.col + shape.length) {
          cell.hasH = true;
          // A run reaches past an edge only when another cell of the same run sits there.
          if (col > shape.col) cell.left = true;
          if (col < shape.col + shape.length - 1) cell.right = true;
        }
      } else if (shape.kind === "v" && shape.col === col) {
        if (row >= shape.row && row < shape.row + shape.length) {
          cell.hasV = true;
          if (row > shape.row) cell.up = true;
          if (row < shape.row + shape.length - 1) cell.down = true;
        }
      }
    }
    return cell;
  }

  /** Arms for the final glyph, including joins where a perpendicular stroke crosses. */
  armsAt(row, col) {
    const cell = this.cellAt(row, col);
    const arms = { up: cell.up, down: cell.down, left: cell.left, right: cell.right };

    const above = this.inBounds(row - 1, col) ? this.cellAt(row - 1, col) : undefined;
    const below = this.inBounds(row + 1, col) ? this.cellAt(row + 1, col) : undefined;
    const prior = this.inBounds(row, col - 1) ? this.cellAt(row, col - 1) : undefined;
    const next = this.inBounds(row, col + 1) ? this.cellAt(row, col + 1) : undefined;

    if (cell.hasH) {
      if (above?.hasV) arms.up = true;
      if (below?.hasV) arms.down = true;
    }
    if (cell.hasV) {
      if (prior?.hasH) arms.left = true;
      if (next?.hasH) arms.right = true;
    }
    return arms;
  }

  /** Resolves one cell to its final character. */
  at(row, col) {
    if (!this.inBounds(row, col)) return " ";

    for (let i = this.shapes.length - 1; i >= 0; i--) {
      const shape = this.shapes[i];
      if (shape.kind === "stroke") {
        if (shape.row === row && shape.col === col) return shape.char;
        continue;
      }
      if (shape.kind === "cells") {
        const cell = shape.cells.find((item) => item.row === row && item.col === col);
        if (cell) return cell.char;
        continue;
      }
      if (shape.kind !== "text") continue;
      const lines = shape.text.split("\n");
      const lineIndex = row - shape.row;
      if (lineIndex < 0 || lineIndex >= lines.length) continue;
      const line = lines[lineIndex];
      const charIndex = col - shape.col;
      if (charIndex < 0 || charIndex >= line.length) continue;
      return line[charIndex];
    }

    const cell = this.cellAt(row, col);
    const axis = cell.hasH ? "h" : cell.hasV ? "v" : undefined;
    return glyphFor(this.armsAt(row, col), axis);
  }

  /** Board as text: trailing spaces trimmed, trailing blank rows dropped. */
  toText() {
    const lines = [];
    for (let row = 0; row < this.rows; row++) {
      let line = "";
      for (let col = 0; col < this.cols; col++) line += this.at(row, col);
      lines.push(line.replace(/\s+$/, ""));
    }
    while (lines.length > 0 && lines[lines.length - 1] === "") lines.pop();
    return lines.join("\n");
  }

  /** Board wrapped in a fenced block, ready to paste into a prompt. */
  toMarkdown() {
    const text = this.toText();
    if (text === "") return "";
    const runs = text.match(/`+/g) ?? [];
    const longest = runs.reduce((max, run) => Math.max(max, run.length), 0);
    const fence = "`".repeat(Math.max(3, longest + 1));
    return `${fence}\n${text}\n${fence}\n`;
  }

  /** Serializes the shape list so a draft can round-trip through the client. */
  toShapeList() {
    return this.shapes.map((shape, index) => ({ id: `shape-${index + 1}`, ...shape }));
  }

  /** Rebuilds a board from a previously serialized shape list. */
  static fromShapes(rows, cols, shapes) {
    const board = new Board(rows, cols);
    for (const shape of shapes ?? []) board.add(shape);
    return board;
  }
}

/**
 * MarkWire component library.
 *
 * Every UI element in the sidebar draws through this module so the shape of each
 * component is defined once and can be unit tested without a browser.
 */

function drawComponent(target, kind, top, left, height, width) {
  switch (kind) {
    case "button": {
      const size = Math.max(3, height);
      const inner = Math.max(8, width - 2);
      const label = "OK";
      const labelLeft = Math.max(0, Math.floor((inner - label.length) / 2));
      const labelRow = Math.floor((size - 1) / 2);
      target.text(top, left, `[${" ".repeat(inner)}]`);
      for (let row = 1; row < size; row++) {
        const text = row === labelRow
          ? `[${" ".repeat(labelLeft)}${label}${" ".repeat(Math.max(0, inner - labelLeft - label.length))}]`
          : `[${" ".repeat(inner)}]`;
        target.text(top + row, left, text);
      }
      break;
    }
    case "input":
      target.text(top, left, `[${"_".repeat(Math.max(8, width - 2))}]`);
      break;
    case "card": {
      const w = Math.max(16, width);
      const h = Math.max(6, height);
      target.box(top, left, h, w);
      target.text(top + 1, left + 2, "Title");
      target.hline(top + 3, left, w);
      break;
    }
    case "table": {
      const h = Math.max(5, height);
      const columns = 4;
      const w = Math.max(columns * 8 + columns + 1, width);
      const cellWidth = Math.max(7, Math.floor((w - columns - 1) / columns));
      const tableWidth = cellWidth * columns + columns + 1;
      const frame = Array.from({ length: columns }, (_, index) => {
        const label = `Col ${String.fromCharCode(65 + index)}`;
        return ` ${label.padEnd(cellWidth - 1)}`;
      }).join("│");
      target.box(top, left, h, tableWidth);
      target.hline(top + 2, left, tableWidth);
      for (let index = 1; index < columns; index++) {
        target.vline(top, left + index * (cellWidth + 1), h);
      }
      target.text(top + 1, left, `│${frame}│`.slice(0, tableWidth));
      break;
    }
    case "modal":
      {
        const w = Math.max(24, width);
        const h = Math.max(7, height);
        const actions = "[ Cancel ] [ OK ]";
        target.box(top, left, h, w);
        target.text(top + 1, left + 2, "Dialog");
        target.stroke(top + 1, left + w - 3, "×");
        target.hline(top + 3, left, w);
        target.text(top + h - 3, left + w - actions.length - 2, actions);
      }
      break;
    case "checkbox":
      target.text(top, left, "[ ]");
      target.text(top, left + 4, "Checkbox");
      break;
    case "radio":
      target.text(top, left, "( )");
      target.text(top, left + 4, "Radio");
      break;
    case "dropdown":
      target.box(top, left, 3, Math.max(12, width));
      target.text(top + 1, left + 2, "Select");
      target.stroke(top + 1, left + Math.max(12, width) - 3, "▾");
      break;
    case "toggle":
      target.text(top, left, "[● ] Toggle");
      break;
    case "tabs":
      target.text(top, left, "[ Tab 1 ]  Tab 2  Tab 3");
      break;
    case "search":
      target.box(top, left, 3, Math.max(14, width));
      target.text(top + 1, left + 2, "⌕ Search");
      break;
    case "progress":
      target.text(top, left, "▰▰▰▰▰▱▱▱▱▱");
      break;
    case "breadcrumb":
      target.text(top, left, "Home > Section > Detail");
      break;
    case "pagination":
      target.text(top, left, "‹  1  2  3  ›");
      break;
    case "nav":
      target.text(top, left, "Logo      Link   Link   Link      [ Action ]");
      target.hline(top + 1, left, Math.max(32, width));
      break;
    case "list":
      target.text(top, left, "• Item one\n• Item two\n• Item three");
      break;
    case "placeholder":
      target.box(top, left, Math.max(5, height), Math.max(16, width));
      target.text(top + 1, left + 2, "Image");
      break;
    case "hsplit":
      target.box(top, left, Math.max(6, height), Math.max(16, width));
      target.vline(top, left + Math.floor(Math.max(16, width) / 2), Math.max(6, height));
      break;
    case "image":
      target.box(top, left, Math.max(5, height), Math.max(16, width));
      target.text(top + 2, left + Math.floor(Math.max(16, width) / 2) - 1, "IMG");
      break;
  }
}

/** Returns an inline 256x256 SVG that inherits the surrounding text color. */
function icon(name) {
  const paths = ICONS[name];
  if (!paths) return "";
  return `<svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">${paths
    .map((d) => `<path d="${d}"/>`)
    .join("")}</svg>`;
}

/** Names available to the editor. */
const ICON_NAMES = Object.keys(ICONS);

/**
 * MarkWire editor shell.
 *
 * The editor owns only interaction state. All characters come from the shared
 * Board engine so the tool result, the canvas, and Markdown export cannot drift.
 */

const PAINT_TOOLS = new Set(["pencil", "brush", "spray", "shade", "fill", "smudge", "scatter", "eraser"]);

function mountMarkWire(root, options) {
  const { Board, rows, cols, shapes = [] } = options;
  let board = Board.fromShapes(rows, cols, shapes);
  let activeTool = "select";
  let dragStart = null;
  let dragPreview = null;
  let selectDrag = null;
  let selectedId = null;
  let pendingTextCell = null;
  let editingTextId = null;
  let lastLayerSignature = "";
  const preferenceKey = "markwire.preferences";
  const preferences = readPreferences();
  let gridLines = preferences.gridLines ?? true;
  let theme = preferences.theme ?? "light";
  let eraserSize = preferences.eraserSize ?? 1;
  let undoStack = [];
  let redoStack = [];

  root.innerHTML = `
    <div class="mw-app">
      <aside class="mw-side" id="mw-tools"></aside>
      <main class="mw-center">
        <div class="mw-toolbar">
          <button data-act="undo" title="Undo (Ctrl+Z)" aria-label="Undo">${icon("undo")}</button>
          <button data-act="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">${icon("redo")}</button>
          <button data-act="clear" title="Clear Canvas" aria-label="Clear canvas">${icon("clear")}</button>
          <button data-act="grid" title="Toggle grid lines" aria-label="Toggle grid" aria-pressed="${gridLines}">${icon("grid")}</button>
          <button data-act="theme" title="Dark mode" aria-label="Toggle theme">${icon("theme")}</button>
          <label class="mw-eraser-size" hidden>
            <span class="mw-icon" aria-hidden="true">${icon("eraser")}</span>
            <input type="range" min="1" max="9" step="1" value="${eraserSize}"
              aria-label="Eraser size">
            <output>${eraserSize}</output>
          </label>
          <button class="mw-primary" data-act="copy">Copy Markdown</button>
        </div>
        <div class="mw-canvas">
          <div class="mw-grid-wrap">
            <div class="mw-grid" role="grid" aria-label="ASCII wireframe canvas"></div>
            <div class="mw-eraser-preview" hidden></div>
          </div>
        </div>
        <div class="mw-statusbar">
          <span class="mw-status">Ready</span>
          <span class="mw-grow"></span>
          <span class="mw-cursor">Ln 1, Col 1</span>
          <select class="mw-size-select" aria-label="Canvas size"></select>
        </div>
      </main>
      <aside class="mw-inspector">
        <section class="mw-section">
          <h3>Layers</h3>
          <div class="mw-layers"></div>
        </section>
        <section class="mw-section">
          <h3>Inspect</h3>
          <div class="mw-inspect"></div>
        </section>
      </aside>
      <nav class="mw-mobile-tools" aria-label="Tools"></nav>
      <input class="mw-text-input" placeholder="Label text" aria-label="Label text" hidden>
      <textarea class="mw-output" readonly aria-label="Markdown output" hidden></textarea>
    </div>`;

  const toolsEl = root.querySelector("#mw-tools");
  const mobileEl = root.querySelector(".mw-mobile-tools");
  const gridEl = root.querySelector(".mw-grid");
  const statusEl = root.querySelector(".mw-status");
  const cursorEl = root.querySelector(".mw-cursor");
  const layersEl = root.querySelector(".mw-layers");
  const inspectEl = root.querySelector(".mw-inspect");
  const sizeEl = root.querySelector(".mw-size-select");
  const textInputEl = root.querySelector(".mw-text-input");
  const outputEl = root.querySelector(".mw-output");
  const eraserSizeEl = root.querySelector(".mw-eraser-size");
  const eraserRangeEl = root.querySelector(".mw-eraser-size input");
  const eraserOutputEl = root.querySelector(".mw-eraser-size output");
  const eraserPreviewEl = root.querySelector(".mw-eraser-preview");
  const gridWrapEl = root.querySelector(".mw-grid-wrap");
  gridEl.classList.toggle("is-gridless", !gridLines);
  applyTheme(theme);

  for (const group of GROUPS) {
    const section = document.createElement("section");
    section.className = "mw-group";
    section.innerHTML = `<h2>${group.title}</h2>`;
    for (const tool of group.tools) section.append(toolButton(tool));
    if (group.more?.length) {
      const more = document.createElement("button");
      more.className = "mw-more";
      more.type = "button";
      more.textContent = "more ▾";
      const secondary = document.createElement("div");
      secondary.className = "mw-secondary";
      for (const tool of group.more) secondary.append(toolButton(tool));
      more.addEventListener("click", () => {
        const open = secondary.classList.toggle("is-open");
        more.textContent = open ? "more ▴" : "more ▾";
      });
      section.append(more, secondary);
    }
    toolsEl.append(section);
  }

  const mobileTools = GROUPS.flatMap((group) => [
    ...group.tools,
    ...(group.more ?? []),
  ]);
  for (const tool of mobileTools) {
    const button = document.createElement("button");
    button.type = "button";
    button.dataset.tool = tool[0];
    button.innerHTML = `<span class="mw-icon">${icon(tool[0])}</span><span>${tool[1]}</span>`;
    button.setAttribute("aria-label", tool[1]);
    button.addEventListener("click", () => setTool(tool[0]));
    mobileEl.append(button);
  }

  for (const [colsValue, rowsValue, label] of SIZES) {
    const option = document.createElement("option");
    option.value = `${rowsValue}x${colsValue}`;
    option.textContent = `${label} (${colsValue}×${rowsValue})`;
    option.selected = rowsValue === board.rows && colsValue === board.cols;
    sizeEl.append(option);
  }

  function toolButton([id, label]) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "mw-tool";
    button.dataset.tool = id;
    button.innerHTML = `<span class="mw-icon">${icon(id)}</span><span>${label}</span>`;
    button.title = label;
    button.setAttribute("aria-label", label);
    button.addEventListener("click", () => setTool(id));
    return button;
  }

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function readPreferences() {
    try {
      return JSON.parse(root.ownerDocument.defaultView?.localStorage?.getItem(preferenceKey) ?? "{}");
    } catch {
      return {};
    }
  }

  function savePreferences() {
    try {
      root.ownerDocument.defaultView?.localStorage?.setItem(
        preferenceKey,
        JSON.stringify({ theme, gridLines, eraserSize }),
      );
    } catch {}
  }

  function snapshot() {
    return Board.fromShapes(board.rows, board.cols, board.shapes);
  }

  function pushUndo() {
    undoStack.push(snapshot());
    if (undoStack.length > 50) undoStack.shift();
    redoStack = [];
    syncHistoryButtons();
  }

  function restore(next) {
    board = next;
    selectedId = null;
    render();
  }

  function undo() {
    const previous = undoStack.pop();
    if (!previous) return false;
    redoStack.push(snapshot());
    restore(previous);
    syncHistoryButtons();
    return true;
  }

  function redo() {
    const next = redoStack.pop();
    if (!next) return false;
    undoStack.push(snapshot());
    restore(next);
    syncHistoryButtons();
    return true;
  }

  function syncHistoryButtons() {
    const undoButton = root.querySelector("[data-act=undo]");
    const redoButton = root.querySelector("[data-act=redo]");
    if (undoButton) undoButton.disabled = undoStack.length === 0;
    if (redoButton) redoButton.disabled = redoStack.length === 0;
  }

  function setTool(tool) {
    activeTool = tool;
    dragStart = null;
    dragPreview = null;
    selectDrag = null;
    eraserSizeEl.hidden = tool !== "eraser";
    eraserPreviewEl.hidden = tool !== "eraser";
    for (const button of root.querySelectorAll("[data-tool]")) {
      button.setAttribute("aria-pressed", String(button.dataset.tool === tool));
    }
    setStatus(`${tool} tool`);
    render();
  }

  eraserRangeEl.addEventListener("input", () => {
    eraserSize = Number(eraserRangeEl.value);
    eraserOutputEl.textContent = String(eraserSize);
    savePreferences();
  });

  function currentBoard() {
    if (!dragPreview) return board;
    const preview = snapshot();
    applyGesture(preview, dragPreview, true);
    return preview;
  }

  function applyGesture(target, kind, isPreview = false) {
    if (!dragStart) return;
    const start = dragStart;
    const end = start.end;
    const top = Math.min(start.row, end.row);
    const left = Math.min(start.col, end.col);
    const height = Math.abs(end.row - start.row) + 1;
    const width = Math.abs(end.col - start.col) + 1;

    switch (kind) {
      case "box": target.box(top, left, height, width); break;
      case "line":
        if (Math.abs(end.row - start.row) >= Math.abs(end.col - start.col)) {
          target.vline(top, start.col, height);
        } else {
          target.hline(start.row, left, width);
        }
        break;
      case "arrow": target.arrow(start.row, start.col, end.row - start.row, end.col - start.col); break;
      case "pencil": target.stroke(start.row, start.col, "█"); break;
      case "eraser": target.erase(top, left, height, width); break;
      default:
        if (!isPreview) component(target, kind, top, left, height, width);
    }
  }

  /** Paints every cell between two pointer samples so fast strokes stay connected. */
  function paintLine(target, kind, row, col, endRow, endCol) {
    let currentRow = row;
    let currentCol = col;
    const dRow = Math.abs(endRow - row);
    const dCol = Math.abs(endCol - col);
    const stepRow = row < endRow ? 1 : -1;
    const stepCol = col < endCol ? 1 : -1;
    let error = dCol - dRow;
    for (;;) {
      paintCell(target, kind, currentRow, currentCol);
      if (currentRow === endRow && currentCol === endCol) break;
      const doubled = error * 2;
      if (doubled > -dRow) {
        error -= dRow;
        currentCol += stepCol;
      }
      if (doubled < dCol) {
        error += dCol;
        currentRow += stepRow;
      }
    }
  }

  /** Applies one tool's character at a cell. */
  function paintCell(target, kind, row, col) {
    if (kind === "eraser") {
      const offset = Math.floor((eraserSize - 1) / 2);
      target.erase(row - offset, col - offset, eraserSize, eraserSize);
      return;
    }
    const char = {
      pencil: "█",
      brush: "▓",
      spray: "░",
      shade: "▒",
      fill: "█",
      smudge: "▒",
      scatter: ".",
    }[kind] ?? "█";
    target.stroke(row, col, char);
  }

  function component(target, kind, top, left, height, width) {
    const start = target.shapes.length;
    const role = kind[0].toUpperCase() + kind.slice(1);
    drawComponent(target, kind, top, left, height, width);
    target.labelSince(start, role);
  }

  function render(dirty) {
    renderCells(dirty);
    const layerSignature = JSON.stringify({
      selectedId,
      shapes: board.shapes.map((shape) => [shape.id, shape.role, shape.row, shape.col, shape.width, shape.height, shape.length, shape.text]),
    });
    if (layerSignature !== lastLayerSignature) {
      lastLayerSignature = layerSignature;
      renderLayers();
      renderInspector();
    }
    syncSizeSelect();
  }

  /** Keeps the canvas-size control in step with the board after undo or tool results. */
  function syncSizeSelect() {
    const value = `${board.rows}x${board.cols}`;
    for (const option of [...sizeEl.options]) {
      if (option.dataset.custom === "true") option.remove();
    }
    if (![...sizeEl.options].some((option) => option.value === value)) {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = `Custom (${board.cols}×${board.rows})`;
      option.dataset.custom = "true";
      sizeEl.append(option);
    }
    sizeEl.value = value;
  }

  function renderCells(dirty) {
    const view = currentBoard();
    const text = view.toText().split("\n");
    const selected = selectedId ? view.select(selectedId) : null;
    const expected = board.rows * board.cols;
    if (gridEl.childElementCount !== expected) {
      const fragment = document.createDocumentFragment();
      for (let index = 0; index < expected; index++) {
        const cell = document.createElement("div");
        cell.className = "mw-cell";
        fragment.append(cell);
      }
      gridEl.replaceChildren(fragment);
    }
    gridEl.style.gridTemplateColumns = `repeat(${board.cols}, var(--mw-cell))`;
    const startRow = dirty ? Math.max(0, Math.min(dirty.top, dirty.bottom)) : 0;
    const endRow = dirty ? Math.min(board.rows - 1, Math.max(dirty.top, dirty.bottom)) : board.rows - 1;
    const startCol = dirty ? Math.max(0, Math.min(dirty.left, dirty.right)) : 0;
    const endCol = dirty ? Math.min(board.cols - 1, Math.max(dirty.left, dirty.right)) : board.cols - 1;
    for (let row = startRow; row <= endRow; row++) {
      const line = text[row] ?? "";
      for (let col = startCol; col <= endCol; col++) {
        const node = gridEl.children[row * board.cols + col];
        const char = line[col] ?? " ";
        if (node.textContent !== char) node.textContent = char;
        const isSelected = Boolean(selected && shapeContains(selected, row, col));
        if (node.classList.contains("is-selected") !== isSelected) {
          node.classList.toggle("is-selected", isSelected);
        }
      }
    }
  }

  function shapeContains(shape, row, col) {
    if (shape.kind === "cells") {
      return shape.cells.some((cell) => cell.row === row && cell.col === col);
    }
    if (shape.kind === "box") {
      return row >= shape.row && row < shape.row + shape.height && col >= shape.col && col < shape.col + shape.width;
    }
    if (shape.kind === "h") return row === shape.row && col >= shape.col && col < shape.col + shape.length;
    if (shape.kind === "v") return col === shape.col && row >= shape.row && row < shape.row + shape.length;
    if (shape.kind === "text") {
      const lines = shape.text.split("\n");
      const lineIndex = row - shape.row;
      if (lineIndex < 0 || lineIndex >= lines.length) return false;
      return col >= shape.col && col < shape.col + lines[lineIndex].length;
    }
    return shape.row === row && shape.col === col;
  }

  function shapeBottom(shape) {
    if (shape.kind === "cells") return Math.max(...shape.cells.map((cell) => cell.row));
    if (shape.kind === "box") return shape.row + shape.height - 1;
    if (shape.kind === "v") return shape.row + shape.length - 1;
    if (shape.kind === "text") return shape.row + shape.text.split("\n").length - 1;
    return shape.row;
  }

  function shapeRight(shape) {
    if (shape.kind === "cells") return Math.max(...shape.cells.map((cell) => cell.col));
    if (shape.kind === "box") return shape.col + shape.width - 1;
    if (shape.kind === "h") return shape.col + shape.length - 1;
    if (shape.kind === "text") {
      const lines = shape.text.split("\n");
      return shape.col + Math.max(...lines.map((line) => line.length)) - 1;
    }
    return shape.col;
  }

  function renderLayers() {
    if (board.shapes.length === 0) {
      layersEl.innerHTML = `<div class="mw-empty">Draw something to see layers.</div>`;
      return;
    }
    layersEl.innerHTML = board.shapes
      .map((shape, index) => `<button class="mw-layer" type="button" data-layer="${index}" aria-selected="${shape.id === selectedId}"><span>${index + 1}. ${escapeHtml(shape.role ?? shape.kind)}</span></button>`)
      .join("");
  }

  function renderInspector() {
    const shape = selectedId ? board.select(selectedId) : null;
    if (!shape) {
      inspectEl.innerHTML = `<div class="mw-empty">Select a layer to edit its properties.</div>`;
      return;
    }
    const fields = [
      ["Role", "role", shape.role ?? shape.kind],
      ["Row", "row", shape.kind === "cells" ? Math.min(...shape.cells.map((cell) => cell.row)) : shape.row],
      ["Col", "col", shape.kind === "cells" ? Math.min(...shape.cells.map((cell) => cell.col)) : shape.col],
    ];
    if (shape.kind === "box") fields.push(["Width", "width", shape.width], ["Height", "height", shape.height]);
    if (shape.kind === "h") fields.push(["Length", "length", shape.length]);
    if (shape.kind === "v") fields.push(["Length", "length", shape.length]);
    if (shape.kind === "text") fields.push(["Text", "text", shape.text]);
    inspectEl.innerHTML = fields
      .map(([label, key, value]) => `<div class="mw-field"><label>${label}<input data-prop="${key}" value="${escapeAttr(value)}"></label></div>`)
      .join("");
  }

  function applyProperty(key, raw) {
    const shape = selectedId ? board.select(selectedId) : null;
    if (!shape) return;
    const textKeys = new Set(["text", "role"]);
    const numeric = !textKeys.has(key);
    let value = numeric ? Number.parseInt(raw, 10) : raw;
    if (numeric && !Number.isFinite(value)) return;
    if (numeric) {
      const max = key === "row" ? board.rows - 1
        : key === "col" ? board.cols - 1
        : key === "height" ? board.rows - shape.row
        : board.cols - shape.col;
      value = clamp(value, key === "height" || key === "width" || key === "length" ? 1 : 0, max);
    }
    if (shape.kind === "cells" && (key === "row" || key === "col")) {
      const current = key === "row"
        ? Math.min(...shape.cells.map((cell) => cell.row))
        : Math.min(...shape.cells.map((cell) => cell.col));
      if (value === current) return;
      pushUndo();
      board.move(shape.id, key === "row" ? value - current : 0, key === "col" ? value - current : 0);
      render();
      return;
    }
    if (shape[key] === value) return;
    pushUndo();
    shape[key] = value;
    render();
  }

  function toCell(event) {
    const rect = gridEl.getBoundingClientRect();
    const cellWidth = rect.width / board.cols;
    const cellHeight = rect.height / board.rows;
    return {
      row: clamp(Math.floor((event.clientY - rect.top) / cellHeight), 0, board.rows - 1),
      col: clamp(Math.floor((event.clientX - rect.left) / cellWidth), 0, board.cols - 1),
    };
  }

  gridEl.addEventListener("pointerdown", (event) => {
    const cell = toCell(event);
    cursorEl.textContent = `Ln ${cell.row + 1}, Col ${cell.col + 1}`;
    if (activeTool === "select") {
      const hit = [...board.shapes].reverse().find((shape) => shapeContains(shape, cell.row, cell.col));
      selectedId = hit?.id ?? null;
      if (selectedId) {
        const selected = board.select(selectedId);
        const resizable = selected && ["box", "h", "v"].includes(selected.kind);
        const corner = resizable && cell.row === shapeBottom(selected) && cell.col === shapeRight(selected);
        selectDrag = { id: selectedId, start: cell, mode: corner ? "resize" : "move", changed: false };
        gridEl.setPointerCapture(event.pointerId);
      }
      render();
      return;
    }
    if (activeTool === "text") {
      pendingTextCell = cell;
      textInputEl.hidden = false;
      textInputEl.focus();
      textInputEl.select();
      setStatus("Type a label, then press Enter");
      return;
    }
    dragStart = { ...cell, end: cell, changed: false };
    dragPreview = activeTool;
    gridEl.setPointerCapture(event.pointerId);
    if (PAINT_TOOLS.has(activeTool)) {
      pushUndo();
      dragStart.changed = true;
      paintCell(board, activeTool, cell.row, cell.col);
    }
    render();
  });

  gridEl.addEventListener("pointermove", (event) => {
    const cell = toCell(event);
    cursorEl.textContent = `Ln ${cell.row + 1}, Col ${cell.col + 1}`;
    if (activeTool === "eraser") updateEraserPreview(cell);
    if (selectDrag) {
      const dRow = cell.row - selectDrag.start.row;
      const dCol = cell.col - selectDrag.start.col;
      if ((dRow || dCol) && !selectDrag.changed) {
        pushUndo();
        selectDrag.changed = true;
      }
      if (selectDrag.mode === "resize") board.resizeByGesture(selectDrag.id, dRow, dCol);
      else board.moveByGesture(selectDrag.id, dRow, dCol);
      selectDrag.start = cell;
      render();
      return;
    }
    if (!dragStart) return;
    if (cell.row !== dragStart.row || cell.col !== dragStart.col) {
      if (!dragStart.changed) {
        pushUndo();
        dragStart.changed = true;
      }
    }
    dragStart.end = cell;
    if (PAINT_TOOLS.has(activeTool)) {
      paintLine(board, activeTool, dragStart.row, dragStart.col, cell.row, cell.col);
      const dirty = {
        top: Math.min(dragStart.row, cell.row) - 1,
        bottom: Math.max(dragStart.row, cell.row) + 1,
        left: Math.min(dragStart.col, cell.col) - 1,
        right: Math.max(dragStart.col, cell.col) + 1,
      };
      dragStart.row = cell.row;
      dragStart.col = cell.col;
      render(dirty);
      return;
    }
    render();
  });

  gridEl.addEventListener("pointerleave", () => {
    eraserPreviewEl.hidden = true;
  });

  /** Draws the square eraser footprint under the pointer. */
  function updateEraserPreview(cell) {
    const cellWidth = gridEl.getBoundingClientRect().width / board.cols;
    const cellHeight = gridEl.getBoundingClientRect().height / board.rows;
    const offset = Math.floor((eraserSize - 1) / 2);
    const top = clamp(cell.row - offset, 0, board.rows - 1);
    const left = clamp(cell.col - offset, 0, board.cols - 1);
    const height = Math.min(eraserSize, board.rows - top);
    const width = Math.min(eraserSize, board.cols - left);
    eraserPreviewEl.hidden = false;
    eraserPreviewEl.style.left = `${gridEl.offsetLeft + left * cellWidth}px`;
    eraserPreviewEl.style.top = `${gridEl.offsetTop + top * cellHeight}px`;
    eraserPreviewEl.style.width = `${width * cellWidth}px`;
    eraserPreviewEl.style.height = `${height * cellHeight}px`;
  }

  gridEl.addEventListener("pointerup", (event) => {
    if (selectDrag) {
      selectDrag = null;
      render();
      return;
    }
    if (!dragStart) return;
    const cell = toCell(event);
    if (cell.row !== dragStart.row || cell.col !== dragStart.col) {
      if (!dragStart.changed) {
        pushUndo();
        dragStart.changed = true;
      }
    }
    dragStart.end = cell;
    const before = board.shapes.length;
    if (!dragStart.changed) {
      dragStart = null;
      dragPreview = null;
      render();
      return;
    }
    applyGesture(board, dragPreview);
    if (board.shapes.length > before) selectedId = board.shapes[board.shapes.length - 1].id;
    dragStart = null;
    dragPreview = null;
    render();
  });

  gridEl.addEventListener("dblclick", (event) => {
    const cell = toCell(event);
    const hit = [...board.shapes].reverse().find((shape) => shapeContains(shape, cell.row, cell.col));
    if (!hit || hit.kind !== "text") return;
    selectedId = hit.id;
    pendingTextCell = { row: hit.row, col: hit.col };
    editingTextId = hit.id;
    textInputEl.value = hit.text;
    textInputEl.hidden = false;
    textInputEl.focus();
    textInputEl.select();
    setStatus("Edit label, then press Enter");
  });

  root.addEventListener("click", (event) => {
    const layer = event.target.closest("[data-layer]");
    if (layer) {
      selectedId = board.shapes[Number(layer.dataset.layer)]?.id ?? null;
      render();
      return;
    }
    const button = event.target.closest("[data-act]");
    if (!button) return;
    handleAction(button.dataset.act, button);
  });

  inspectEl.addEventListener("change", (event) => {
    const input = event.target.closest("[data-prop]");
    if (input) applyProperty(input.dataset.prop, input.value);
  });

  textInputEl.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      event.preventDefault();
      pendingTextCell = null;
      editingTextId = null;
      textInputEl.value = "";
      textInputEl.hidden = true;
      setStatus("Text cancelled");
      return;
    }
    if (event.key !== "Enter") return;
    event.preventDefault();
    const value = textInputEl.value.trim();
    if (!value || !pendingTextCell) {
      setStatus("Enter text first");
      return;
    }
    pushUndo();
    const existing = editingTextId ? board.select(editingTextId) : null;
    const shape = existing ?? board.add({
      kind: "text",
      row: pendingTextCell.row,
      col: pendingTextCell.col,
      text: value,
    });
    if (existing) existing.text = value;
    selectedId = shape.id;
    pendingTextCell = null;
    editingTextId = null;
    textInputEl.value = "";
    textInputEl.hidden = true;
    render();
    setStatus(existing ? "Text updated" : "Text added");
  });

  root.ownerDocument.addEventListener("paste", (event) => {
    const target = event.target;
    if (target?.tagName === "INPUT" || target?.tagName === "TEXTAREA" || target?.isContentEditable) return;
    const raw = event.clipboardData?.getData("text/plain") ?? "";
    if (!raw.trim()) return;
    event.preventDefault();
    let text = raw.replace(/\r/g, "").replace(/\t/g, "    ");
    text = stripCodeFence(text);
    pushUndo();
    const shape = board.pasteText(text);
    if (!shape) {
      undo();
      setStatus("Nothing to paste");
      return;
    }
    selectedId = shape.id;
    render();
    setStatus("Pasted");
  });

  sizeEl.addEventListener("change", () => {
    const [rowsValue, colsValue] = sizeEl.value.split("x").map(Number);
    if (rowsValue === board.rows && colsValue === board.cols) return;
    pushUndo();
    const next = Board.fromShapes(rowsValue, colsValue, board.shapes);
    restore(next);
    const hidden = next.shapes.some((shape) => !shapeFits(shape, next));
    setStatus(hidden ? "Canvas resized · some content is outside the view" : "Canvas resized");
  });

  /** Reports whether a shape is fully inside the current canvas. */
  function shapeFits(shape, target) {
    if (shape.kind === "cells") {
      return shape.cells.every((cell) => cell.row < target.rows && cell.col < target.cols);
    }
    if (shape.kind === "box") {
      return shape.row + shape.height <= target.rows && shape.col + shape.width <= target.cols;
    }
    if (shape.kind === "h") return shape.row < target.rows && shape.col + shape.length <= target.cols;
    if (shape.kind === "v") return shape.col < target.cols && shape.row + shape.length <= target.rows;
    if (shape.kind === "text") {
      const lines = shape.text.split("\n");
      const width = Math.max(...lines.map((line) => line.length));
      return shape.row + lines.length <= target.rows && shape.col + width <= target.cols;
    }
    return shape.row < target.rows && shape.col < target.cols;
  }

  root.ownerDocument.addEventListener("keydown", (event) => {
    const target = event.target;
    const inField = target?.tagName === "INPUT"
      || target?.tagName === "TEXTAREA"
      || target?.isContentEditable;
    const mod = event.metaKey || event.ctrlKey;
    if (inField) return;
    if (mod && event.key.toLowerCase() === "z") {
      event.preventDefault();
      setStatus(event.shiftKey ? (redo() ? "Redone" : "Nothing to redo") : (undo() ? "Undone" : "Nothing to undo"));
      return;
    }
    if (event.key === "Escape") {
      event.preventDefault();
      selectedId = null;
      dragStart = null;
      dragPreview = null;
      selectDrag = null;
      outputEl.hidden = true;
      render();
      return;
    }
    if (mod && event.key === "[") {
      if (!selectedId) return;
      event.preventDefault();
      pushUndo();
      if (!board.reorder(selectedId, -1)) {
        undo();
        return;
      }
      render();
      return;
    }
    if (mod && event.key === "]") {
      if (!selectedId) return;
      event.preventDefault();
      pushUndo();
      if (!board.reorder(selectedId, 1)) {
        undo();
        return;
      }
      render();
      return;
    }
    if (event.key === "Delete" || event.key === "Backspace") {
      if (!selectedId) return;
      event.preventDefault();
      pushUndo();
      if (!board.remove(selectedId)) {
        undo();
        return;
      }
      selectedId = null;
      render();
      return;
    }
    if (selectedId && event.key.startsWith("Arrow")) {
      const delta = {
        ArrowUp: [-1, 0],
        ArrowDown: [1, 0],
        ArrowLeft: [0, -1],
        ArrowRight: [0, 1],
      }[event.key];
      if (!delta) return;
      event.preventDefault();
      pushUndo();
      board.move(selectedId, delta[0], delta[1]);
      render();
    }
  });

  function handleAction(action, button) {
    if (action === "undo") return setStatus(undo() ? "Undone" : "Nothing to undo");
    if (action === "redo") return setStatus(redo() ? "Redone" : "Nothing to redo");
    if (action === "clear") {
      if (board.shapes.length === 0) return setStatus("Nothing to clear");
      pushUndo();
      board.clear();
      selectedId = null;
      render();
      return setStatus("Cleared");
    }
    if (action === "grid") {
      gridLines = !gridLines;
      gridEl.classList.toggle("is-gridless", !gridLines);
      button.setAttribute("aria-pressed", String(gridLines));
      savePreferences();
      return;
    }
    if (action === "theme") {
      applyTheme(theme === "light" ? "dark" : "light");
      savePreferences();
      return;
    }
    if (action === "copy") return copyMarkdown();
  }

  /** Applies one theme to the document and the toolbar control. */
  function applyTheme(next) {
    theme = next;
    root.ownerDocument.documentElement.dataset.theme = theme;
    const button = root.querySelector("[data-act=theme]");
    if (!button) return;
    button.title = theme === "light" ? "Dark mode" : "Light mode";
    button.setAttribute("aria-label", button.title);
    button.setAttribute("aria-pressed", String(theme === "dark"));
  }

  async function copyMarkdown() {
    const markdown = board.toMarkdown();
    if (!markdown) return setStatus("Nothing to copy");
    try {
      const clipboard = root.ownerDocument.defaultView.navigator.clipboard;
      if (!clipboard?.writeText) throw new Error("Clipboard API unavailable");
      await clipboard.writeText(markdown);
      outputEl.hidden = true;
      setStatus("Copied");
    } catch {
      const textarea = root.ownerDocument.createElement("textarea");
      textarea.value = markdown;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      root.ownerDocument.body.append(textarea);
      textarea.select();
      const copied = root.ownerDocument.execCommand("copy");
      textarea.remove();
      if (copied) {
        setStatus("Copied");
        return;
      }
      outputEl.value = markdown;
      outputEl.hidden = false;
      setStatus("Copy unavailable · Markdown shown below");
    }
  }

  const bridge = createHostBridge();
  bridge.onHostContext = (context) => {
    if (context?.theme === "dark" || context?.theme === "light") {
      applyTheme(context.theme);
    }
  };
  bridge.onToolInput = (params) => {
    const args = params?.arguments ?? params;
    if (!args || typeof args !== "object") return;
    if (!Array.isArray(args.shapes) && !args.rows && !args.cols) return;
    applyLayout(args);
    setStatus("Loading layout…");
  };
  bridge.onToolResult = (result) => {
    const data = result?.structuredContent;
    if (!data) return;
    applyLayout(data);
    setStatus("Ready");
  };

  /** Replaces the board from a tool payload and resets per-document state. */
  function applyLayout(data) {
    undoStack = [];
    redoStack = [];
    board = Board.fromShapes(data.rows ?? board.rows, data.cols ?? board.cols, data.shapes ?? []);
    selectedId = null;
    pendingTextCell = null;
    editingTextId = null;
    selectDrag = null;
    outputEl.hidden = true;
    syncHistoryButtons();
    render();
  }
  bridge.start();

  setTool("select");
  syncHistoryButtons();
  render();

  return {
    get board() { return board; },
    render,
    undo,
    redo,
    setTool,
  };
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

/** Removes one surrounding Markdown code fence, including longer fences. */
function stripCodeFence(text) {
  const lines = text.split("\n");
  const openFence = lines[0]?.match(/^`{3,}$/);
  const closeFence = lines.at(-1)?.match(/^`{3,}$/);
  if (openFence && closeFence && openFence[0].length === closeFence[0].length) {
    return lines.slice(1, -1).join("\n");
  }
  return text;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (char) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;",
  })[char]);
}

function escapeAttr(value) {
  return escapeHtml(value).replace(/`/g, "&#96;");
}

/** Minimal MCP Apps host bridge for the standard handshake and host events. */
function createHostBridge() {
  let nextId = 1;
  const pending = new Map();
  const api = { onToolResult: undefined, onToolInput: undefined, onHostContext: undefined, start };

  function post(message) {
    if (typeof window === "undefined" || window.parent === window) return;
    window.parent.postMessage(message, "*");
  }

  function request(method, params, timeoutMs = 3000) {
    return new Promise((resolve, reject) => {
      if (typeof window === "undefined" || window.parent === window) {
        reject(new Error("MCP Apps host unavailable"));
        return;
      }
      const id = nextId++;
      const timer = setTimeout(() => {
        pending.delete(id);
        reject(new Error(`${method} timed out`));
      }, timeoutMs);
      pending.set(id, { resolve, reject, timer });
      post({ jsonrpc: "2.0", id, method, params });
    });
  }

  function onMessage(event) {
    if (typeof window === "undefined" || event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.jsonrpc !== "2.0") return;
    if (typeof message.id === "number") {
      const item = pending.get(message.id);
      if (!item) return;
      pending.delete(message.id);
      clearTimeout(item.timer);
      if (message.error) item.reject(new Error(message.error.message ?? "MCP Apps request failed"));
      else item.resolve(message.result);
      return;
    }
    if (message.method === "ui/notifications/tool-result") api.onToolResult?.(message.params);
    if (message.method === "ui/notifications/tool-input") api.onToolInput?.(message.params);
    if (message.method === "ui/notifications/host-context-changed") api.onHostContext?.(message.params);
  }

  async function start() {
    if (typeof window === "undefined" || window.parent === window) return;
    window.addEventListener("message", onMessage, { passive: true });
    try {
      await request("ui/initialize", {
        appInfo: { name: "markwire", version: "1.0.0" },
        appCapabilities: {},
        protocolVersion: "2026-01-26",
      });
      post({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} });
    } catch {}
  }

  return api;
}

mountMarkWire(document.getElementById("markwire-root"), { Board, rows: 40, cols: 80, shapes: [] });
</script>
